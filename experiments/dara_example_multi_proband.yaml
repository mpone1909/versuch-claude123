# DARA Multi-Proband Example Experiment
# Experiment mit mehreren Probanden über längeren Zeitraum

name: dara_multi_proband_example
description: |
  DARA-Experiment mit 3 Probanden.
  Demonstriert Multi-Proband-Aggregation und Prozessanalyse.
  Vollständiger Datensatz (1000 Zeilen).

# CSV-Dateien (werden mit synthetic_data_generator erstellt)
csv_file_paths:
  - data/synthetic_example/proband_1.csv
  - data/synthetic_example/proband_2.csv
  - data/synthetic_example/proband_3.csv

# Proband-IDs
proband_ids:
  - P1
  - P2
  - P3

# Primäres Analysefeld
primary_field: value

# Analyse-Parameter
baseline_threshold: 0.3
peak_threshold: 0.8

# Kein Zeitfenster -> vollständiger Datensatz
# row_range: null

# Evaluierung und Reporting
run_evaluation: true
create_notion_report: false
create_gdrive_doc: false
